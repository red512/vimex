apiVersion: v1
kind: Secret
metadata:
  name: github-token
  namespace: argo
type: Opaque
data:
  # For public repositories, you might not need a token, but if you do:
  # Replace 'YOUR_GITHUB_TOKEN_HERE' with a base64-encoded GitHub Personal Access Token
  # To create the token: echo -n 'your_actual_token' | base64
  # For public repos, you can often use an empty token: echo -n '' | base64
  token: ""  # Empty for public repos, or base64-encoded token if needed