---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: pr-environments
  namespace: argo
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  generators:
  - pullRequest:
      github:
        owner: red512
        repo: vimex
        tokenRef:
          secretName: github-token
          key: token
        labels:
        - deploy
      requeueAfterSeconds: 30
  template:
    metadata:
      name: 'pr-{{number}}-{{branch}}'
      labels:
        pr-number: '{{number}}'
        branch: '{{branch}}'
        environment: preview
    spec:
      project: default
      source:
        repoURL: https://github.com/red512/vimex-gitops
        targetRevision: HEAD
        path: gitops/helm/backend-helm-chart
        helm:
          valueFiles:
          - values.yaml
          parameters:
          - name: image.tag
            value: 'pr-{{number}}'
          - name: nameOverride
            value: 'vimex-pr-{{number}}'
          - name: fullnameOverride
            value: 'vimex-pr-{{number}}'
          - name: ingress.enabled
            value: 'true'
          - name: ingress.className
            value: 'nginx'
          - name: ingress.annotations.nginx\.ingress\.kubernetes\.io/rewrite-target
            value: '/'
          - name: ingress.hosts[0].host
            value: 'pr-{{number}}.vimex.local'
          - name: ingress.hosts[0].paths[0].path
            value: '/'
          - name: ingress.hosts[0].paths[0].pathType
            value: 'Prefix'
          - name: service.port
            value: '5000'
          - name: resources.limits.cpu
            value: '200m'
          - name: resources.limits.memory
            value: '256Mi'
          - name: resources.requests.cpu
            value: '100m'
          - name: resources.requests.memory
            value: '128Mi'
          - name: replicaCount
            value: '1'
          - name: env[0].name
            value: 'ENVIRONMENT'
          - name: env[0].value
            value: 'pr-{{number}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'pr-{{number}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - Validate=true
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
          - PruneLast=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
  syncPolicy:
    preserveResourcesOnDeletion: false