version: '3.8'

services:
  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  test-runner:
    build: .
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - API_KEY=${API_KEY:-dummy-api-key}
    volumes:
      - .:/app
    working_dir: /app
    command: |
      sh -c "
        echo '🧪 Running tests with Redis...'
        python test_unit.py
        echo '✅ Unit tests passed!'
      "