name: Release

on:
  workflow_run:
    workflows: ["Security Scan"]
    types: [completed]
    branches: ['main']
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current version
        id: current_version
        run: |
          if [ ! -f be-flask/version.txt ]; then
            echo "1.0.0" > be-flask/version.txt
          fi
          echo "version=$(cat be-flask/version.txt)" >> $GITHUB_OUTPUT

      - name: Bump version
        id: bump
        run: |
          CURRENT_VERSION="${{ steps.current_version.outputs.version }}"
          IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"
          
          # Determine bump type
          BUMP_TYPE="${{ github.event.inputs.version_type || 'patch' }}"
          
          case $BUMP_TYPE in
            major)
              NEW_VERSION="$((major + 1)).0.0"
              ;;
            minor)
              NEW_VERSION="$major.$((minor + 1)).0"
              ;;
            patch)
              NEW_VERSION="$major.$minor.$((patch + 1))"
              ;;
          esac
          
          echo "$NEW_VERSION" > be-flask/version.txt
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          if git tag -l | grep -q "^v$NEW_VERSION$"; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag v$NEW_VERSION already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create release
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          BUMP_TYPE="${{ steps.bump.outputs.bump_type }}"
          
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          git add be-flask/version.txt
          git commit -m "chore: release v$NEW_VERSION [skip ci]"
          git tag "v$NEW_VERSION" -m "Release $NEW_VERSION ($BUMP_TYPE bump)"
          git push origin main --tags

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "v${{ steps.bump.outputs.new_version }}"
          release_name: "Release v${{ steps.bump.outputs.new_version }}"
          body: |
            ## Release v${{ steps.bump.outputs.new_version }}
            
            **Type**: ${{ steps.bump.outputs.bump_type }} version bump
            **Branch**: ${{ github.ref_name }}
            
            ### What's Changed
            - Version bumped from ${{ steps.current_version.outputs.version }} to ${{ steps.bump.outputs.new_version }}
            
            ### Security Status
            - All security scans completed successfully
            - Download security reports from previous workflow run
          draft: false
          prerelease: false

      - name: Notify release
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          BUMP_TYPE="${{ steps.bump.outputs.bump_type }}"
          
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"🚀 Released v$NEW_VERSION for ${{ github.repository }} ($BUMP_TYPE bump)\"}" \
            ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify if skipped
        if: steps.check_tag.outputs.exists == 'true'
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"⏭️ Release v$NEW_VERSION already exists for ${{ github.repository }} - skipped\"}" \
            ${{ secrets.SLACK_WEBHOOK_URL }}