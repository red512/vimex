name: Version Bump

on:
  push:
    branches: ['main']
    paths: ['be-flask/**']

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version
        run: |
          # Get or create version
          if [ ! -f be-flask/version.txt ]; then
            echo "1.0.0" > be-flask/version.txt
          fi
          
          # Read current version and increment patch
          VERSION=$(cat be-flask/version.txt)
          IFS='.' read -r major minor patch <<< "$VERSION"
          NEW_VERSION="$major.$minor.$((patch + 1))"
          
          echo "$NEW_VERSION" > be-flask/version.txt
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Create tag and release
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          # Skip if tag exists
          if git tag -l | grep -q "^v$NEW_VERSION$"; then
            echo "Tag v$NEW_VERSION already exists"
            exit 0
          fi
          
          # Commit, tag, and push
          git add be-flask/version.txt
          git commit -m "chore: bump to v$NEW_VERSION [skip ci]" || exit 0
          git tag "v$NEW_VERSION"
          git push origin main --tags

      - name: Notify Slack
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"🚀 Released v$NEW_VERSION for ${{ github.repository }}\"}" \
            ${{ secrets.SLACK_WEBHOOK_URL }}