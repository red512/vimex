name: CI Pipeline

on:
  pull_request:
    branches: ['main']
    paths: ['be-flask/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      API_KEY: ${{ secrets.API_KEY }}
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r be-flask/requirements.txt

      - name: Start Redis
        run: |
          sudo apt-get update && sudo apt-get install -y redis-server
          sudo systemctl start redis-server
          timeout 30 bash -c 'until redis-cli ping > /dev/null 2>&1; do sleep 1; done'

      - name: Run unit tests
        run: cd be-flask && python test_unit.py

      - name: Start Flask app and Celery
        run: |
          cd be-flask
          python app.py &
          echo $! > flask.pid
          timeout 30 bash -c 'until curl -sf http://localhost:5000/health > /dev/null; do sleep 1; done'
          celery -A app.celery worker --loglevel=info --detach

      - name: Run integration tests
        run: cd be-flask && python test_integration.py

      - name: Cleanup
        if: always()
        run: |
          [ -f be-flask/flask.pid ] && kill $(cat be-flask/flask.pid) 2>/dev/null || true
          pkill -f "python.*app.py|celery.*worker" || true

  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        check: [docker, security]
    steps:
      - uses: actions/checkout@v4
      
      - name: Docker build test
        if: matrix.check == 'docker'
        uses: docker/build-push-action@v5
        with:
          context: be-flask
          platforms: linux/amd64
          push: false
          tags: flask-w:test
      
      - name: Security scan
        if: matrix.check == 'security'
        run: |
          python -m pip install --upgrade pip
          pip install -r be-flask/requirements.txt pip-audit
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          VULNS_FOUND=false
          
          echo "### 🔒 pip-audit" >> $GITHUB_STEP_SUMMARY
          if pip-audit --requirement be-flask/requirements.txt >> $GITHUB_STEP_SUMMARY 2>&1; then
            echo "✅ Clean" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Vulnerabilities found" >> $GITHUB_STEP_SUMMARY
            VULNS_FOUND=true
          fi
          
          echo "### 🔍 Grype" >> $GITHUB_STEP_SUMMARY
          cd be-flask
          if grype . --fail-on medium -q >> $GITHUB_STEP_SUMMARY 2>&1; then
            echo "✅ Clean" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Vulnerabilities found" >> $GITHUB_STEP_SUMMARY
            VULNS_FOUND=true
          fi
          
          echo "has-vulnerabilities=$VULNS_FOUND" >> $GITHUB_OUTPUT

  notify:
    needs: [test, validate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send notification
        run: |
          [[ "${{ needs.test.result }}" == "success" ]] && TEST="✅ Passed" || TEST="❌ Failed"
          [[ "${{ needs.validate.result }}" == "success" ]] && VALIDATE="✅ Passed" || VALIDATE="❌ Failed"
          
          if [[ "${{ needs.test.result }}" == "success" && "${{ needs.validate.result }}" == "success" ]]; then
            HEADER="✅ All checks passed for ${{ github.repository }} (PR #${{ github.event.pull_request.number }})"
          else
            HEADER="❌ Pipeline failed for ${{ github.repository }} (PR #${{ github.event.pull_request.number }})"
          fi
          
          MESSAGE="$HEADER\\n**Tests:** $TEST\\n**Validation:** $VALIDATE\\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
          
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"$MESSAGE\"}" \
            ${{ secrets.SLACK_WEBHOOK_URL }}