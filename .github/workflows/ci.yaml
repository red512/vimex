  security:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      pip-vulns: ${{ steps.summary.outputs.pip_vulns }}
      grype-vulns: ${{ steps.summary.outputs.grype_vulns }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r be-flask/requirements.txt

      - name: pip-audit security scan
        run: |
          pip install pip-audit
          echo "## 🔒 pip-audit Security Scan Results" >> $GITHUB_STEP_SUMMARY
          
          if pip-audit --requirement be-flask/requirements.txt; then
            echo "✅ No vulnerabilities found by pip-audit" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Vulnerabilities detected by pip-audit:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            pip-audit --requirement be-flask/requirements.txt >> $GITHUB_STEP_SUMMARY 2>&1 || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          
          pip-audit --requirement be-flask/requirements.txt --format=json --output=pip-audit-report.json || true

      - name: Grype vulnerability scan
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          cd be-flask && pip freeze > installed-requirements.txt
          
          echo "## 🔍 Grype Vulnerability Scan Results" >> $GITHUB_STEP_SUMMARY
          grype dir:. --output json --file grype-report.json || true
          
          VULN_COUNT=$(cat grype-report.json | jq '.matches | length' 2>/dev/null || echo "0")
          if [ "$VULN_COUNT" -eq 0 ]; then
            echo "✅ No vulnerabilities found by Grype" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Found $VULN_COUNT vulnerabilities by Grype:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grype dir:. --by-cve --output table >> $GITHUB_STEP_SUMMARY 2>&1 || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Generate security summary
        id: summary
        run: |
          PIP_VULNS=$(cat pip-audit-report.json | jq '.dependencies | map(.vulns | length) | add' 2>/dev/null || echo "0")
          GRYPE_VULNS=$(cat be-flask/grype-report.json | jq '.matches | length' 2>/dev/null || echo "0")
          echo "pip_vulns=$PIP_VULNS" >> $GITHUB_OUTPUT
          echo "grype_vulns=$GRYPE_VULNS" >> $GITHUB_OUTPUT
          echo "Debug: PIP_VULNS=$PIP_VULNS, GRYPE_VULNS=$GRYPE_VULNS"

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports-${{ github.run_number }}
          path: |
            pip-audit-report.json
            be-flask/grype-report.json
            be-flask/installed-requirements.txt

