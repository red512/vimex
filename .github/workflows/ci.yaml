name: CI Tests BE with Security

on:
  push:
    branches:
      - 'main'
      - 'develop*'
    paths:
      - 'be-flask/**'
  workflow_dispatch:  # This event allows manual triggering
  pull_request:
    paths:
      - 'be-flask/**'
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'be-flask/**'

jobs:
  security-and-tests:
    runs-on: ubuntu-latest
    env:
      API_KEY: ${{ secrets.API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r be-flask/requirements.txt

      # Security Checks
      - name: Python Security Check with pip-audit
        run: |
          pip install pip-audit
          echo "Starting pip-audit security scan..."
          echo "## 🔒 pip-audit Security Scan Results" >> $GITHUB_STEP_SUMMARY
          
          # Run pip-audit with correct format (no table option, just default output)
          if pip-audit --requirement be-flask/requirements.txt; then
            echo "✅ No vulnerabilities found by pip-audit" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Vulnerabilities detected by pip-audit:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            pip-audit --requirement be-flask/requirements.txt >> $GITHUB_STEP_SUMMARY 2>&1 || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          
          # Always generate JSON report
          pip-audit --requirement be-flask/requirements.txt --format=json --output=pip-audit-report.json || true

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Create requirements file for scanning
        run: |
          cd be-flask
          pip freeze > installed-requirements.txt

      - name: Scan Python dependencies with Grype
        run: |
          cd be-flask
          echo "Starting Grype vulnerability scan..."
          echo "## 🔍 Grype Vulnerability Scan Results" >> $GITHUB_STEP_SUMMARY
          
          # Run Grype and check the JSON output for matches
          grype dir:. --scope squashed --output json --file grype-report.json || true
          
          # Check if vulnerabilities were found by parsing JSON
          VULN_COUNT=$(cat grype-report.json | jq '.matches | length' 2>/dev/null || echo "0")
          
          if [ "$VULN_COUNT" -eq 0 ]; then
            echo "✅ No vulnerabilities found by Grype" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Found $VULN_COUNT vulnerabilities by Grype:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            # Use --by-cve flag to show CVE numbers instead of GHSA IDs
            grype dir:. --scope squashed --output table --by-cve --quiet >> $GITHUB_STEP_SUMMARY 2>&1 || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      # Comment on PR with security summary
      - name: Comment PR with security summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment = '## 🔒 Security Check Results\n\n';
            comment += '- ✅ pip-audit scan completed\n';
            comment += '- ✅ Grype vulnerability scan completed\n';
            comment += '\n📊 Detailed reports available in the Actions artifacts.\n';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      # Tests
      - name: Start Server
        run: |
          python be-flask/app.py &
          sleep 5

      - name: Run integration tests
        run: |
          python be-flask/test_integration.py

      - name: Run unit tests
        run: |
          python be-flask/test_unit.py

      - name: Stop Server
        run: |
          pkill -f app.py

      # Upload security reports
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports-${{ github.run_number }}
          path: |
            pip-audit-report.json
            be-flask/grype-report.json
            be-flask/installed-requirements.txt
          retention-days: 30

      # Generate security summary for Slack
      - name: Generate security summary
        run: |
          # Count vulnerabilities from reports
          PIP_AUDIT_VULNS=$(cat pip-audit-report.json | jq '.dependencies | map(.vulns | length) | add' 2>/dev/null || echo "0")
          GRYPE_VULNS=$(cat be-flask/grype-report.json | jq '.matches | length' 2>/dev/null || echo "0")
          
          # Create summary
          echo "SECURITY_SUMMARY=Security Scan Results: pip-audit found ${PIP_AUDIT_VULNS} vulnerabilities, Grype found ${GRYPE_VULNS} vulnerabilities" >> $GITHUB_ENV

      # Notifications
      - name: Notify on success
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"✅ BE tests and security checks PASSED for ${{ github.repository }} on branch ${{ github.ref_name }}\n${{ env.SECURITY_SUMMARY }}\"}" \
            ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify on failure  
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"❌ BE tests or security checks FAILED for ${{ github.repository }} on branch ${{ github.ref_name }}\n${{ env.SECURITY_SUMMARY }}\nCheck security reports for details\"}" \
            ${{ secrets.SLACK_WEBHOOK_URL }}