name: CI Pipeline

on:
  push:
    branches: ['main', 'develop*']
    paths: ['be-flask/**']
  pull_request:
    paths: ['be-flask/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r be-flask/requirements.txt

  test:
    needs: build
    runs-on: ubuntu-latest
    env:
      API_KEY: ${{ secrets.API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r be-flask/requirements.txt
      - name: Run tests
        run: |
          python be-flask/test_unit.py
          python be-flask/app.py &
          sleep 5
          python be-flask/test_integration.py
          pkill -f app.py || true

  security:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      has-vulnerabilities: ${{ steps.scan.outputs.has-vulnerabilities }}
      summary: ${{ steps.scan.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r be-flask/requirements.txt
      
      - name: Security scan
        id: scan
        run: |
          pip install pip-audit
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          
          # pip-audit scan with detailed output
          echo "### 🔒 pip-audit Security Scan Results" >> $GITHUB_STEP_SUMMARY
          if pip-audit --requirement be-flask/requirements.txt; then
            echo "✅ No vulnerabilities found by pip-audit" >> $GITHUB_STEP_SUMMARY
            PIP_VULNS=false
          else
            echo "⚠️ Vulnerabilities detected by pip-audit:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            pip-audit --requirement be-flask/requirements.txt >> $GITHUB_STEP_SUMMARY 2>&1 || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            PIP_VULNS=true
          fi
          
          # Grype scan with detailed output
          cd be-flask && pip freeze > requirements-frozen.txt
          echo "### 🔍 Grype Vulnerability Scan Results" >> $GITHUB_STEP_SUMMARY
          
          grype dir:. --output json --file grype-report.json || true
          VULN_COUNT=$(cat grype-report.json | jq '.matches | length' 2>/dev/null || echo "0")
          
          if [ "$VULN_COUNT" -eq 0 ]; then
            echo "✅ No vulnerabilities found by Grype" >> $GITHUB_STEP_SUMMARY
            GRYPE_VULNS=false
          else
            echo "⚠️ Found $VULN_COUNT vulnerabilities by Grype:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grype dir:. --by-cve --output table >> $GITHUB_STEP_SUMMARY 2>&1 || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            GRYPE_VULNS=true
          fi
          
          # Set overall vulnerability status
          if [[ "$PIP_VULNS" == "true" || "$GRYPE_VULNS" == "true" ]]; then
            echo "has-vulnerabilities=true" >> $GITHUB_OUTPUT
            echo "summary=Vulnerabilities detected" >> $GITHUB_OUTPUT
          else
            echo "has-vulnerabilities=false" >> $GITHUB_OUTPUT
            echo "summary=No vulnerabilities found" >> $GITHUB_OUTPUT
          fi

  release:
    needs: security
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bump version
        run: |
          if [ ! -f be-flask/version.txt ]; then echo "1.0.0" > be-flask/version.txt; fi
          VERSION=$(cat be-flask/version.txt)
          IFS='.' read -r major minor patch <<< "$VERSION"
          NEW_VERSION="$major.$minor.$((patch + 1))"
          echo "$NEW_VERSION" > be-flask/version.txt
          
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add be-flask/version.txt
          git commit -m "chore: release v$NEW_VERSION [skip ci]" || exit 0
          git tag "v$NEW_VERSION"
          git push origin main --tags

  notify:
    needs: [build, test, security, release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send notification
        run: |
          BUILD_STATUS="${{ needs.build.result }}"
          TEST_STATUS="${{ needs.test.result }}"
          SECURITY_STATUS="${{ needs.security.result }}"
          RELEASE_STATUS="${{ needs.release.result }}"
          HAS_VULNS="${{ needs.security.outputs.has-vulnerabilities }}"
          
          # Build workflow URL
          WORKFLOW_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          # Build status details
          BUILD_ICON=$([[ "$BUILD_STATUS" == "success" ]] && echo "✅" || echo "❌")
          TEST_ICON=$([[ "$TEST_STATUS" == "success" ]] && echo "✅" || echo "❌")
          SECURITY_ICON=$([[ "$SECURITY_STATUS" == "success" && "$HAS_VULNS" != "true" ]] && echo "✅" || [[ "$SECURITY_STATUS" == "success" ]] && echo "⚠️" || echo "❌")
          
          # Determine overall status
          if [[ "$BUILD_STATUS" == "success" && "$TEST_STATUS" == "success" && "$SECURITY_STATUS" == "success" ]]; then
            if [[ "$HAS_VULNS" == "true" ]]; then
              STATUS="Tests passed - Security vulnerabilities found"
              EMOJI="⚠️"
            else
              STATUS="All checks passed"
              EMOJI="✅"
            fi
          else
            STATUS="Pipeline failed"
            EMOJI="❌"
          fi
          
          # Add release info for main branch
          if [[ "${{ github.ref }}" == "refs/heads/main" && "$RELEASE_STATUS" == "success" ]]; then
            STATUS="$STATUS - New version released"
            EMOJI="🚀"
          fi
          
          # Build detailed message
          MESSAGE="$EMOJI $STATUS for ${{ github.repository }} (${{ github.ref_name }})"
          MESSAGE="$MESSAGE\\n\\n**Tests:** $TEST_ICON $([[ "$TEST_STATUS" == "success" ]] && echo "Passed" || echo "Failed")"
          MESSAGE="$MESSAGE\\n**Security:** $SECURITY_ICON $([[ "$SECURITY_STATUS" == "success" && "$HAS_VULNS" != "true" ]] && echo "Clean" || [[ "$SECURITY_STATUS" == "success" ]] && echo "Vulnerabilities detected" || echo "Scan failed")"
          
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            RELEASE_ICON=$([[ "$RELEASE_STATUS" == "success" ]] && echo "✅" || echo "❌")
            MESSAGE="$MESSAGE\\n**Release:** $RELEASE_ICON $([[ "$RELEASE_STATUS" == "success" ]] && echo "Version bumped" || echo "Failed")"
          fi
          
          MESSAGE="$MESSAGE\\n\\n<$WORKFLOW_URL|View Pipeline Details>"
          
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"$MESSAGE\"}" \
            ${{ secrets.SLACK_WEBHOOK_URL }}