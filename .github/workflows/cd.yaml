name: CD Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
  push:
    branches: ['main']
    paths: ['be-flask/**']

permissions:
  contents: write
  packages: write

jobs:
  version-bump:
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Fetch latest version
        id: fetch_version
        run: |
          # Try to get the latest tag, if it exists
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          # Remove 'v' prefix and store in version.txt if it doesn't exist
          CURRENT_VERSION=${LATEST_TAG#v}
          if [ ! -f be-flask/version.txt ]; then
            echo "$CURRENT_VERSION" > be-flask/version.txt
          fi
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: Bump version
        id: bump
        run: |
          CURRENT_VERSION="${{ steps.fetch_version.outputs.current_version }}"
          IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"
          NEW_VERSION="$major.$minor.$((patch + 1))"
          
          # Update version file
          echo "$NEW_VERSION" > be-flask/version.txt
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Stage, commit, and push changes
          git add be-flask/version.txt
          git commit -m "chore: release v$NEW_VERSION [skip ci]" || exit 0
          git tag -a "v$NEW_VERSION" -m "Release v$NEW_VERSION"
          
          # Try to push with retries for race conditions
          MAX_RETRIES=3
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if git push origin main --tags; then
              break
            fi
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              git pull --rebase origin main
              sleep 5
            fi
          done
          
          if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
            echo "Failed to push after $MAX_RETRIES attempts"
            exit 1
          fi

  build-and-push:
    needs: version-bump
    if: always() && (needs.version-bump.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.version-bump.outputs.new_version || github.event.inputs.version || 'manual' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set version for manual runs
        id: set_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ -f be-flask/version.txt ]; then
              VERSION=$(cat be-flask/version.txt)
            else
              VERSION="manual-$(date +%Y%m%d-%H%M%S)"
            fi
            echo "build_version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "build_version=${{ needs.version-bump.outputs.new_version }}" >> $GITHUB_OUTPUT
          fi
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: be-flask
          push: true
          tags: |
            projectred521/flask-ip:latest
            projectred521/flask-ip:v${{ steps.set_version.outputs.build_version }}
            projectred521/flask-ip:${{ github.sha }}

  update-gitops:
    needs: [version-bump, build-and-push]
    if: always() && needs.build-and-push.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Update GitOps repository
        run: |
          # Determine version to use
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ -f be-flask/version.txt ]; then
              NEW_VERSION=$(cat be-flask/version.txt)
            else
              NEW_VERSION="manual-$(date +%Y%m%d-%H%M%S)"
            fi
            ENVIRONMENT="${{ github.event.inputs.environment }}"
          else
            NEW_VERSION="${{ needs.version-bump.outputs.new_version }}"
            ENVIRONMENT="staging"
          fi
          
          echo "Updating GitOps for version: v$NEW_VERSION, environment: $ENVIRONMENT"
          
          # Clone GitOps repository
          git clone https://${{ secrets.GITHUB_TOKEN }}@github.com/red512/vimex-gitops.git
          cd vimex-gitops
          
          # Update the Helm values file
          VALUES_FILE="gitops/environments/$ENVIRONMENT/backend-helm-chart/values.yaml"
          if [ -f "$VALUES_FILE" ]; then
            sed -i "s/tag: v[0-9]\+\.[0-9]\+\.[0-9]\+/tag: v$NEW_VERSION/" "$VALUES_FILE"
            sed -i "s/tag: manual-.*/tag: v$NEW_VERSION/" "$VALUES_FILE"
            
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add "$VALUES_FILE"
            git commit -m "chore: update backend image to v$NEW_VERSION for $ENVIRONMENT"
            git push origin main
          else
            echo "Values file not found: $VALUES_FILE"
            exit 1
          fi

  notify:
    needs: [version-bump, build-and-push, update-gitops]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send notification
        run: |
          # Determine job statuses
          VERSION_STATUS="${{ needs.version-bump.result }}"
          BUILD_STATUS="${{ needs.build-and-push.result }}"
          GITOPS_STATUS="${{ needs.update-gitops.result }}"
          
          # Determine version for display
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            DISPLAY_VERSION="manual deployment"
            ENVIRONMENT="${{ github.event.inputs.environment }}"
          else
            DISPLAY_VERSION="v${{ needs.version-bump.outputs.new_version }}"
            ENVIRONMENT="staging"
          fi
          
          # Build status lines
          if [[ "$VERSION_STATUS" == "success" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION_LINE="**Version:** ✅ $DISPLAY_VERSION"
          else
            VERSION_LINE="**Version:** ❌ Failed"
          fi
          
          if [[ "$BUILD_STATUS" == "success" ]]; then
            BUILD_LINE="**Docker Build:** ✅ Completed"
          else
            BUILD_LINE="**Docker Build:** ❌ Failed"
          fi
          
          if [[ "$GITOPS_STATUS" == "success" ]]; then
            GITOPS_LINE="**GitOps Update:** ✅ $ENVIRONMENT environment updated"
          else
            GITOPS_LINE="**GitOps Update:** ❌ Failed"
          fi
          
          # Overall status
          if [[ "$BUILD_STATUS" == "success" && "$GITOPS_STATUS" == "success" ]]; then
            HEADER="🚀 Deployment successful for ${{ github.repository }} ($DISPLAY_VERSION)"
          else
            HEADER="❌ Deployment failed for ${{ github.repository }}"
          fi
          
          WORKFLOW_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE="$HEADER\\n$VERSION_LINE\\n$BUILD_LINE\\n$GITOPS_LINE\\n<$WORKFLOW_URL|View Deployment Details>"
          
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"$MESSAGE\"}" \
            ${{ secrets.SLACK_WEBHOOK_URL }}"