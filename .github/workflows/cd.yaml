    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Bump version
        id: bump
        run: |
          if [ ! -f be-flask/version.txt ]; then echo "1.0.0" > be-flask/version.txt; fi
          VERSION=$(cat be-flask/version.txt)
          IFS='.' read -r major minor patch <<< "$VERSION"
          NEW_VERSION="$major.$minor.$((patch + 1))"
          echo "$NEW_VERSION" > be-flask/version.txt
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add be-flask/version.txt
          git commit -m "chore: release v$NEW_VERSION [skip ci]" || exit 0
          git tag "v$NEW_VERSION"
          git push origin main --tags

  build-and-push:
    needs: version-bump
    runs-on: ubuntu-latest
    env:
      REGISTRY: docker.io
      IMAGE_NAME: projectred521/flask-ip
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: be-flask
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ needs.version-bump.outputs.new_version }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  approve-production:
    needs: [version-bump, build-and-push]
    if: github.event.inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Manual approval step
        run: echo "Deployment to production approved"

  update-gitops:
    needs: [version-bump, build-and-push, approve-production]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Update GitOps repository
        env:
          NEW_VERSION: ${{ needs.version-bump.outputs.new_version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone https://${GITHUB_TOKEN}@github.com/red512/vimex-gitops.git
          cd vimex-gitops
          
          # Update the Helm values file with new version
          sed -i "s/tag: v[0-9]\+\.[0-9]\+\.[0-9]\+/tag: v$NEW_VERSION/" \
            gitops/environments/${{ github.event.inputs.environment || 'staging' }}/backend-helm-chart/values.yaml
          
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "chore: update backend image to v$NEW_VERSION"
          git push origin main

  notify:
    needs: [version-bump, build-and-push, update-gitops]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send notification
        run: |
          # Determine individual job statuses
          VERSION_OK=$([[ "${{ needs.version-bump.result }}" == "success" ]] && echo "true" || echo "false")
          BUILD_OK=$([[ "${{ needs.build-and-push.result }}" == "success" ]] && echo "true" || echo "false")
          GITOPS_OK=$([[ "${{ needs.update-gitops.result }}" == "success" ]] && echo "true" || echo "false")
          
          # Build status message
          if [[ "$VERSION_OK" == "true" && "$BUILD_OK" == "true" && "$GITOPS_OK" == "true" ]]; then
            HEADER="✅ Deployment successful for ${{ github.repository }} (v${{ needs.version-bump.outputs.new_version }})"
            STATUS="Deployment completed successfully:\\n"
            STATUS+="• Version: v${{ needs.version-bump.outputs.new_version }}\\n"
            STATUS+="• Image: projectred521/flask-ip:v${{ needs.version-bump.outputs.new_version }}\\n"
            STATUS+="• Environment: ${{ github.event.inputs.environment || 'staging' }}"
          else
            HEADER="❌ Deployment failed for ${{ github.repository }}"
            STATUS="Deployment steps status:\\n"
            [[ "$VERSION_OK" == "true" ]] && STATUS+="• Version bump: ✅\\n" || STATUS+="• Version bump: ❌\\n"
            [[ "$BUILD_OK" == "true" ]] && STATUS+="• Docker build/push: ✅\\n" || STATUS+="• Docker build/push: ❌\\n"
            [[ "$GITOPS_OK" == "true" ]] && STATUS+="• GitOps update: ✅\\n" || STATUS+="• GitOps update: ❌\\n"
          fi
          
          WORKFLOW_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE="$HEADER\\n\\n$STATUS\\n<$WORKFLOW_URL|View Deployment Details>"
          
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"$MESSAGE\"}" \
            ${{ secrets.SLACK_WEBHOOK_URL }}