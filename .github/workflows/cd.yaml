name: CD Pipeline

on:
  push:
    branches: ['main']
    paths: ['be-flask/**']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: write
  packages: write

jobs:
  version-bump:
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Bump version
        id: bump
        run: |
          [ ! -f be-flask/version.txt ] && echo "1.0.0" > be-flask/version.txt
          IFS='.' read -r major minor patch < be-flask/version.txt
          
          NEW_PATCH=$((patch + 1))
          NEW_VERSION="$major.$minor.$NEW_PATCH"
          
          while git tag -l | grep -q "^v$NEW_VERSION$"; do
            NEW_PATCH=$((NEW_PATCH + 1))
            NEW_VERSION="$major.$minor.$NEW_PATCH"
          done
          
          echo "$NEW_VERSION" > be-flask/version.txt
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add be-flask/version.txt
          git commit -m "chore: release v$NEW_VERSION [skip ci]" || exit 0
          git tag "v$NEW_VERSION"
          git push origin main --tags

  deploy:
    needs: version-bump
    if: always() && (needs.version-bump.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      environment: ${{ steps.version.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set version and environment
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION=$(cat be-flask/version.txt 2>/dev/null || echo "manual-$(date +%Y%m%d-%H%M%S)")
            ENV="${{ github.event.inputs.environment }}"
          else
            VERSION="${{ needs.version-bump.outputs.new_version }}"
            ENV="staging"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "sha_short=${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: be-flask
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            projectred521/flask-w:latest
            projectred521/flask-w:v${{ steps.version.outputs.version }}
            projectred521/flask-w:${{ steps.version.outputs.sha_short }}
      
      - name: Update GitOps repository
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GITOPS_DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          
          git clone git@github.com:red512/vimex-gitops.git
          cd vimex-gitops
          
          VALUES_FILE="gitops/environments/${{ steps.version.outputs.environment }}/backend-helm-chart/values.yaml"
          sed -i "s|tag: .*|tag: v${{ steps.version.outputs.version }}|" "$VALUES_FILE"
          
          git add "$VALUES_FILE"
          git commit -m "chore: deploy backend v${{ steps.version.outputs.version }} to ${{ steps.version.outputs.environment }}"
          git push origin main

  notify:
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send notification
        run: |
          VERSION="${{ needs.deploy.outputs.version }}"
          ENV="${{ needs.deploy.outputs.environment }}"
          STATUS="${{ needs.deploy.result }}"
          
          if [[ "$STATUS" == "success" ]]; then
            HEADER="🚀 Deployment successful: v$VERSION → $ENV"
            DOCKER="✅ Built and pushed"
            GITOPS="✅ Updated"
          else
            HEADER="❌ Deployment failed: v$VERSION → $ENV"
            DOCKER="❌ Failed"
            GITOPS="❌ Failed"
          fi
          
          MESSAGE="$HEADER\\n**Version:** v$VERSION\\n**Docker:** $DOCKER\\n**GitOps:** $GITOPS\\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
          
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"$MESSAGE\"}" \
            ${{ secrets.SLACK_WEBHOOK_URL }}